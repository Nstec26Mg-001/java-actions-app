name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: リポジトリのチェックアウト
      uses: actions/checkout@v4

    - name: JDK 17のセットアップ (Temurin)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'
    
    # ここから追加 ---
    - name: コードフォーマットの検証 (Lint)
      run: |
        chmod +x gradlew
        ./gradlew spotlessCheck
    # --- ここまで

    - name: プロジェクトのビルド
      run: |
        chmod +x gradlew
        ./gradlew build -x test